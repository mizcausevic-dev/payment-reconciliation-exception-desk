name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore payment-reconciliation-exception-desk.sln
      - name: Test
        run: dotnet test payment-reconciliation-exception-desk.sln --configuration Release
